[pytest]
# Pytest configuration for LiveKit Agents testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode for async tests
asyncio_mode = auto

# Minimum version
minversion = 7.0

# Markers for categorizing tests
markers =
    asyncio: mark test as async (requires pytest-asyncio)
    unit: mark test as a unit test
    integration: mark test as an integration test
    slow: mark test as slow running (> 1 second)
    tools: mark test as testing function tools
    routing: mark test as testing agent routing
    mocking: mark test as using mocked dependencies

# Output options
addopts =
    # Show test summary info for all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Verbose output
    --verbose
    # Show full diff when assertions fail
    --tb=short
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Capture warnings
    --capture=no
    # Color output
    --color=yes

# Log options
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (optional, requires pytest-cov)
# [tool:pytest]
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Timeout for tests (requires pytest-timeout)
# timeout = 30

# Warnings
filterwarnings =
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
